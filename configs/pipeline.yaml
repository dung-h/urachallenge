pipeline:
  fallback_confidence_threshold: 0.7
  deterministic_physics_authority: true
  validate_premise_ids: true
  validate_final_json: true
  # Z3 sidecar is experiment-only and disabled by production default.
  enable_z3_sidecar: false
  z3_sidecar_mode: experiment_only
  z3_allowed_domains:
    - academic_policy
    - public_logic_sample
  # Strict total-parameter budget: use at most one optional local LLM worker model.
  # Runtime may override via URA_OPENCODE_MODEL / URA_LLM_MODEL.
  reasoner_model: qwen2.5:7b
  formatter_model: qwen2.5:7b
  secondary_formatter_model: qwen2.5:7b
