pipeline:
  # Live DeepSeek and Qwen3 answer fallback stayed disabled after Phase 7.1/7.2:
  # DeepSeek accepted 0 proposals; Qwen3 accepted 2 but degraded accuracy.
  enable_llm_fallback: false
  # Explanation rewriting is optional/manual only. Template explanations from backend trace are production default.
  enable_llm_explanation: false
  fallback_confidence_threshold: 0.7
  deterministic_physics_authority: true
  validate_premise_ids: true
  validate_final_json: true
  # Z3 sidecar is experiment-only and disabled by production default.
  enable_z3_sidecar: false
  z3_sidecar_mode: experiment_only
  z3_allowed_domains:
    - academic_policy
    - public_logic_sample
  # Strict total-parameter budget: use at most one optional LLM worker model.
  # LLM workers remain disabled by default; if enabled, all roles reuse Gemma 4 E2B-it (~2B).
  reasoner_model: gemma4_e2b_it
  formatter_model: gemma4_e2b_it
  secondary_formatter_model: gemma4_e2b_it
