pipeline:
  fallback_confidence_threshold: 0.7
  deterministic_physics_authority: true
  validate_premise_ids: true
  validate_final_json: true
  # Z3 sidecar is experiment-only and disabled by production default.
  enable_z3_sidecar: false
  z3_sidecar_mode: experiment_only
  z3_allowed_domains:
    - academic_policy
    - public_logic_sample
  # Strict total-parameter budget: use one local open-weight worker model.
  # Runtime may override with URA_LLM_MODEL.
  reasoner_model: Qwen/Qwen2.5-7B-Instruct
  formatter_model: Qwen/Qwen2.5-7B-Instruct
  secondary_formatter_model: Qwen/Qwen2.5-7B-Instruct
